---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: windows-2019-image-build
  namespace: vm-demo-app
spec:
  description: |
    Builds a Windows Server 2019 VM disk image from an ISO uploaded to the
    httpd-fileserver. Creates CDI DataVolumes for the ISO and blank disk,
    applies the autounattend ConfigMap, and creates a VirtualMachine that
    boots from the ISO for fully automated installation.
  params:
    - name: iso-url
      type: string
      default: "http://httpd-server.httpd-server.svc.cluster.local:8080/files/win2k19.iso"
      description: Cluster-internal URL of the Windows ISO on the file server
    - name: disk-size
      type: string
      default: "60Gi"
      description: Size of the Windows installation disk
    - name: iso-size
      type: string
      default: "7Gi"
      description: PVC size for the ISO DataVolume
    - name: vm-name
      type: string
      default: "win2019-install"
      description: Name of the installation VM
    - name: namespace
      type: string
      default: "vm-demo-app"
      description: Target namespace
  tasks:
    - name: create-iso-datavolume
      taskRef:
        name: windows-apply-manifest
      params:
        - name: manifest
          value: |
            apiVersion: cdi.kubevirt.io/v1beta1
            kind: DataVolume
            metadata:
              name: win2019-iso
              namespace: $(params.namespace)
              annotations:
                cdi.kubevirt.io/storage.bind.immediate.requested: "true"
            spec:
              source:
                http:
                  url: "$(params.iso-url)"
              pvc:
                accessModes: [ReadWriteOnce]
                storageClassName: gp3-csi
                resources:
                  requests:
                    storage: $(params.iso-size)

    - name: create-disk-datavolume
      taskRef:
        name: windows-apply-manifest
      params:
        - name: manifest
          value: |
            apiVersion: cdi.kubevirt.io/v1beta1
            kind: DataVolume
            metadata:
              name: win2019-disk
              namespace: $(params.namespace)
              annotations:
                cdi.kubevirt.io/storage.bind.immediate.requested: "true"
            spec:
              source:
                blank: {}
              pvc:
                accessModes: [ReadWriteOnce]
                storageClassName: gp3-csi
                resources:
                  requests:
                    storage: $(params.disk-size)

    - name: create-autounattend-configmap
      taskRef:
        name: windows-apply-manifest
      params:
        - name: script
          value: |
            oc apply -f https://raw.githubusercontent.com/tosin2013/acm-virt-management-demo/main/examples/vm-win2019/configmap-autounattend.yaml -n $(params.namespace)
            oc apply -f https://raw.githubusercontent.com/tosin2013/acm-virt-management-demo/main/examples/vm-win2019/configmap-sysprep.yaml -n $(params.namespace)

    - name: create-install-vm
      runAfter:
        - create-iso-datavolume
        - create-disk-datavolume
        - create-autounattend-configmap
      taskRef:
        name: windows-apply-manifest
      params:
        - name: manifest
          value: |
            apiVersion: kubevirt.io/v1
            kind: VirtualMachine
            metadata:
              name: $(params.vm-name)
              namespace: $(params.namespace)
              labels:
                app: windows-install
            spec:
              running: true
              template:
                metadata:
                  labels:
                    kubevirt.io/domain: $(params.vm-name)
                spec:
                  domain:
                    cpu:
                      cores: 4
                    devices:
                      disks:
                        - disk:
                            bus: virtio
                          name: installdisk
                          bootOrder: 2
                        - cdrom:
                            bus: sata
                          name: iso
                          bootOrder: 1
                        - cdrom:
                            bus: sata
                          name: virtiocontainerdisk
                        - cdrom:
                            bus: sata
                          name: autounattend
                      interfaces:
                        - masquerade: {}
                          name: default
                      inputs:
                        - type: tablet
                          bus: usb
                          name: tablet
                    resources:
                      requests:
                        memory: 8Gi
                    machine:
                      type: q35
                    features:
                      acpi: {}
                      hyperv:
                        relaxed: {}
                        vapic: {}
                        spinlocks:
                          spinlocks: 8191
                  networks:
                    - name: default
                      pod: {}
                  volumes:
                    - name: installdisk
                      persistentVolumeClaim:
                        claimName: win2019-disk
                    - name: iso
                      persistentVolumeClaim:
                        claimName: win2019-iso
                    - name: virtiocontainerdisk
                      containerDisk:
                        image: registry.redhat.io/container-native-virtualization/virtio-win-rhel9@sha256:7e06e1f52a434d4602657c920144504fbaed955d0998535bdf345716355ce83a
                    - name: autounattend
                      sysprep:
                        configMap:
                          name: win2019-autounattend
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: windows-apply-manifest
  namespace: vm-demo-app
spec:
  description: Apply a Kubernetes manifest or run a custom script
  params:
    - name: manifest
      type: string
      description: YAML manifest to apply
      default: ""
    - name: script
      type: string
      description: Custom shell script to run instead of applying a manifest
      default: ""
  steps:
    - name: apply
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      script: |
        #!/bin/sh
        set -e
        if [ -n "$(params.script)" ]; then
          eval "$(params.script)"
        else
          echo '$(params.manifest)' | oc apply -f -
        fi
