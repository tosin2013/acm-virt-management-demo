<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520"><defs><marker id="_arrow_danger_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B71C1C"/></marker><marker id="_arrow_platform_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006E6E"/></marker></defs><rect x="0" y="0" width="1200" height="520" fill="#FFFFFF"/><text x="600.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">Defense-in-Depth: Eradicate Cluster Destruction</text><text x="600.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Two independent layers ensure accidental or malicious deletion is impossible.</text><rect x="40" y="200" width="180" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="130.0" y="224" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Operator / Script</text><text x="130.0" y="244" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">oc delete managedcluster</text><rect x="300" y="80" width="340" height="180" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="320" y="105" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#EE0000" text-anchor="start">Layer 1: Non-Destructive ClusterRole</text><rect x="320" y="125" width="290" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="465.0" y="149" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">ClusterRole</text><text x="465.0" y="169" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">get, list, watch only</text><rect x="320" y="190" width="290" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="465.0" y="214" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">No delete permission</text><text x="465.0" y="234" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">on managedcluster resources</text><rect x="300" y="290" width="340" height="180" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="320" y="315" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#006E6E" text-anchor="start">Layer 2: ValidatingAdmissionPolicy</text><rect x="320" y="335" width="290" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="465.0" y="359" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Admission Controller</text><text x="465.0" y="379" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">CEL expression match</text><rect x="320" y="400" width="290" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="465.0" y="424" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">DELETE blocked</text><text x="465.0" y="444" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">on hive.openshift.io/*</text><rect x="740" y="200" width="200" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="840.0" y="224" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Forbidden</text><text x="840.0" y="244" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">403: cluster deletion</text><text x="840.0" y="260" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">is impossible</text><rect x="1010" y="200" width="160" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="1090.0" y="224" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Cluster Safe</text><text x="1090.0" y="244" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Production workloads</text><text x="1090.0" y="260" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">fully protected</text><line x1="220" y1="240" x2="300" y2="170" stroke="#B71C1C" stroke-width="1.6" marker-end="url(#_arrow_danger_0)"/><text x="260.0" y="199.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">Attempt</text><line x1="220" y1="240" x2="300" y2="380" stroke="#B71C1C" stroke-width="1.6" marker-end="url(#_arrow_danger_0)"/><line x1="640" y1="170" x2="740" y2="220" stroke="#B71C1C" stroke-width="1.6" marker-end="url(#_arrow_danger_0)"/><text x="690.0" y="189.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">Denied</text><line x1="640" y1="380" x2="740" y2="260" stroke="#B71C1C" stroke-width="1.6" marker-end="url(#_arrow_danger_0)"/><text x="690.0" y="314.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">Denied</text><line x1="940" y1="240" x2="1010" y2="240" stroke="#006E6E" stroke-width="1.6" marker-end="url(#_arrow_platform_0)"/></svg>